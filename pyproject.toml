[project]
name = "sentinel"
version = "0.1.0"
description = ""
authors = [
    {name = "saksham goyal",email = "sakshamgoyal1974@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "kafka-python (>=2.3.1,<3.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "prometheus-api-client (>=0.7.2,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-json-logger (>=4.1.0,<5.0.0)",
    "kubernetes (>=36.0.1,<37.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
